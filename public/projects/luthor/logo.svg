<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="luthorGrad" x1="0" y1="500" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="55%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="canvasGlow" x1="400" y1="80" x2="400" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0.04" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#7C3AED" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Ambient radial glow -->
  <ellipse cx="400" cy="250" rx="330" ry="190" fill="url(#canvasGlow)" />

  <!-- Top Brand Header: Luthor Official Mark -->
  <g transform="translate(265, 36)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#luthorGrad)" filter="url(#badgeShadow)" />
    <!-- Lucide Sparkles Icon -->
    <g transform="translate(14, 14) scale(1.16)" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
      <path d="M20 3v4" />
      <path d="M22 5h-4" />
      <path d="M4 17v2" />
      <path d="M5 18H3" />
    </g>
    <text x="72" y="36" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="-0.03em">Luthor</text>
    <text x="73" y="54" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#C084FC" letter-spacing="0.14em">VISUAL WEB BUILDER · SAAS</text>
  </g>

  <!-- Visual Editor Window Frame (Matches luthor.app/editor) -->
  <g transform="translate(70, 114)">
    <rect x="0" y="0" width="660" height="346" rx="18" fill="#0F172A" stroke="#334155" stroke-width="1.5" />

    <!-- Top Browser / Editor Bar -->
    <rect x="1" y="1" width="658" height="38" rx="17" fill="#1E293B" />
    <circle cx="22" cy="20" r="5" fill="#F87171" />
    <circle cx="38" cy="20" r="5" fill="#FBBF24" />
    <circle cx="54" cy="20" r="5" fill="#34D399" />

    <!-- URL Pill -->
    <rect x="230" y="9" width="200" height="22" rx="7" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="330" y="24" text-anchor="middle" font-family="monospace" font-size="11" fill="#94A3B8">luthor.app/editor</text>

    <!-- Publish Button -->
    <rect x="572" y="9" width="72" height="22" rx="7" fill="url(#luthorGrad)" />
    <text x="608" y="23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Publicar</text>

    <!-- Left Components Sidebar -->
    <rect x="1" y="39" width="128" height="306" fill="#111827" />
    <line x1="129" y1="39" x2="129" y2="345" stroke="#1E293B" stroke-width="1.5" />
    <rect x="14" y="54" width="64" height="8" rx="4" fill="#334155" />

    <!-- Active Drag Component -->
    <rect x="12" y="74" width="104" height="32" rx="8" fill="#2E1065" stroke="#8B5CF6" stroke-width="1.2" />
    <rect x="22" y="84" width="12" height="12" rx="3" fill="#A855F7" />
    <rect x="42" y="87" width="54" height="6" rx="3" fill="#DDD6FE" />

    <!-- Other Sidebar Blocks -->
    <rect x="12" y="116" width="104" height="30" rx="8" fill="#1E293B" />
    <rect x="22" y="125" width="12" height="12" rx="3" fill="#475569" />
    <rect x="42" y="128" width="48" height="6" rx="3" fill="#64748B" />

    <rect x="12" y="156" width="104" height="30" rx="8" fill="#1E293B" />
    <rect x="22" y="165" width="12" height="12" rx="3" fill="#475569" />
    <rect x="42" y="168" width="58" height="6" rx="3" fill="#64748B" />

    <rect x="12" y="196" width="104" height="30" rx="8" fill="#1E293B" />
    <rect x="22" y="205" width="12" height="12" rx="3" fill="#475569" />
    <rect x="42" y="208" width="44" height="6" rx="3" fill="#64748B" />

    <!-- Center Interactive Canvas -->
    <rect x="146" y="56" width="368" height="134" rx="12" fill="#1E1B4B" fill-opacity="0.45" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="6 4" />
    <rect x="166" y="76" width="180" height="14" rx="5" fill="#C084FC" fill-opacity="0.45" />
    <rect x="166" y="98" width="128" height="9" rx="4" fill="#64748B" fill-opacity="0.55" />
    <rect x="166" y="122" width="96" height="28" rx="8" fill="url(#luthorGrad)" />
    <rect x="378" y="72" width="116" height="98" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />

    <!-- 3 Responsive Grid Cards on Canvas -->
    <rect x="146" y="206" width="114" height="116" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <rect x="160" y="220" width="24" height="24" rx="6" fill="#2E1065" />
    <rect x="160" y="256" width="84" height="9" rx="4" fill="#475569" />
    <rect x="160" y="272" width="64" height="7" rx="3.5" fill="#334155" />

    <rect x="273" y="206" width="114" height="116" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <rect x="287" y="220" width="24" height="24" rx="6" fill="#4A044E" />
    <rect x="287" y="256" width="84" height="9" rx="4" fill="#475569" />
    <rect x="287" y="272" width="64" height="7" rx="3.5" fill="#334155" />

    <rect x="400" y="206" width="114" height="116" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <rect x="414" y="220" width="24" height="24" rx="6" fill="#1E3A8A" />
    <rect x="414" y="256" width="84" height="9" rx="4" fill="#475569" />
    <rect x="414" y="272" width="64" height="7" rx="3.5" fill="#334155" />

    <!-- Right Inspector Panel -->
    <rect x="531" y="39" width="128" height="306" fill="#111827" />
    <line x1="531" y1="39" x2="531" y2="345" stroke="#1E293B" stroke-width="1.5" />
    <rect x="545" y="54" width="58" height="8" rx="4" fill="#475569" />

    <rect x="545" y="78" width="44" height="6" rx="3" fill="#64748B" />
    <rect x="545" y="90" width="98" height="22" rx="6" fill="#1E293B" />

    <rect x="545" y="126" width="52" height="6" rx="3" fill="#64748B" />
    <rect x="545" y="138" width="98" height="22" rx="6" fill="#1E293B" />

    <rect x="545" y="174" width="40" height="6" rx="3" fill="#64748B" />
    <rect x="545" y="186" width="98" height="22" rx="6" fill="#2E1065" stroke="#8B5CF6" stroke-width="1" />

    <rect x="545" y="222" width="60" height="6" rx="3" fill="#64748B" />
    <rect x="545" y="234" width="98" height="22" rx="6" fill="#1E293B" />
  </g>
</svg>

